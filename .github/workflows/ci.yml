name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency (core is zero-dependency)
        run: python -m pip install --upgrade pip pytest

      - name: Byte-compile all modules
        run: python -m compileall -q baugbaunty

      - name: Import the package (proves zero-dep import works)
        run: python -c "import baugbaunty, baugbaunty.cli, baugbaunty.mcp_server; print(baugbaunty.__version__)"

      - name: Run unit tests
        run: python -m pytest -q

      - name: CLI smoke test
        run: |
          python -m baugbaunty --version
          python -m baugbaunty tools
          # scope check: exits non-zero when an asset is out of scope, which is expected here
          python -m baugbaunty scope -c config/example.json www.example.com evil.org || true
          printf '%s\n' '*.example.com' '!internal.example.com' > /tmp/scope.txt
          python -m baugbaunty import -f /tmp/scope.txt --platform list -o /tmp/smoke.json --force
          python -c "import json; c=json.load(open('/tmp/smoke.json')); assert c['scope']['include']==['*.example.com']; print('import OK')"

      - name: MCP handshake smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | python -m baugbaunty mcp \
            | python -c "import sys,json; lines=[json.loads(l) for l in sys.stdin if l.strip()]; assert lines[0]['result']['serverInfo']['name']=='baugbaunty'; assert any(t['name']=='run' for t in lines[1]['result']['tools']); print('MCP OK')"
